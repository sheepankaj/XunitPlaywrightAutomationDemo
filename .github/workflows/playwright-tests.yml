name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Install Playwright Browsers
        run: pwsh XunitPlaywrightAutomationDemo/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Tests
        run: dotnet test --no-build --settings XunitPlaywrightAutomationDemo/test.ci.runsettings

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: XunitPlaywrightAutomationDemo/TestResults/
          retention-days: 30
